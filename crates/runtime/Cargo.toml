[package]
name = "tauri-runtime-servo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tauri webview runtime backed by the Servo engine (in-process libservo)"

[dependencies]
tauri-runtime.workspace = true
tauri-utils = "=2.9.3"
tao.workspace = true
# Legatus engine line: local clone of legatus-ai/servo-engine, `legatus`
# branch (sibling checkout; CI clones it beside this repo). This is how our
# own engine fixes reach the runtime. Crates.io fallback: servo "0.5".
servo = { path = "../../../servo-engine/components/servo", features = ["no-wgl"] }
servo-embedder-traits = { path = "../../../servo-engine/components/shared/embedder" }
euclid = "0.22"
url = "2"
raw-window-handle = "0.6"
surfman = "=0.13.0"
serde_json = "1"
http = "1"
log = "0.4"

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = ["Win32_Foundation"] }
