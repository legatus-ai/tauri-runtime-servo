[package]
name = "tauri-runtime-servo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tauri webview runtime backed by the Servo engine (in-process libservo)"

[dependencies]
tauri-runtime.workspace = true
tauri-utils = "=2.9.3"
tao.workspace = true
servo = { version = "0.5", features = ["no-wgl"] }
servo-embedder-traits = "0.5"
euclid = "0.22"
url = "2"
raw-window-handle = "0.6"
surfman = "=0.13.0"
serde_json = "1"
http = "1"
log = "0.4"

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = ["Win32_Foundation"] }
