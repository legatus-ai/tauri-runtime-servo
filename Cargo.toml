[workspace]
resolver = "2"
members = [
  "crates/runtime",
  "examples/helloworld",
  "examples/probe",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/legatus-ai/tauri-runtime-servo"

[workspace.dependencies]
tauri = { version = "=2.11.5", default-features = false }
tauri-runtime = "=2.11.3"
tauri-utils = "=2.9.3"
tao = "0.34"

# Legatus crate line: patched forks live in sibling checkouts (CI clones
# them beside this repo). Each [patch] entry tracks its upstream release
# and is dropped once the fix lands upstream.
[patch.crates-io]
url = { path = "../rust-url/url" }
